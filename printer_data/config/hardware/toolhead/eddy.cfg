[probe_eddy_current eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: toolhead_mcu
i2c_software_scl_pin: toolhead_mcu:PB10
i2c_software_sda_pin: toolhead_mcu:PB11
x_offset: -19.8
y_offset: -0.75
tap_threshold: 42 # used value from line z: 2.010 # noise 0.001004mm, MAD_Hz=20.953 * 2
reg_drive_current: 16

[bed_mesh]
speed: 250
horizontal_move_z: 2.0
algorithm: bicubic
bicubic_tension: 0.4
split_delta_z: 0.01
mesh_pps:3,3
adaptive_margin: 5
mesh_min: 12,12
mesh_max: 132,140
probe_count: 20,20
fade_start: 0
fade_end: 20
scan_overshoot: 3
