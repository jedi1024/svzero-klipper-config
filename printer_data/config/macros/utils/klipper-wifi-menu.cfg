# Add to printer.cfg (or an included .cfg file)
#
# Requires the "G-Code Shell Command" extra. Install with KIAUH
# (Advanced -> G-Code Shell Command), or manually per:
# https://github.com/th33xitus/kiauh/blob/master/docs/gcode_shell_command.md

[gcode_shell_command wifi_ap_mode]
command: sudo /usr/local/bin/wifi-toggle.sh ap
timeout: 60.0
verbose: True

[gcode_macro WIFI_SETUP_MODE]
description: Switch WiFi to setup AP so a new network can be configured
gcode:
    RUN_SHELL_COMMAND CMD=wifi_ap_mode
    M117 WiFi AP: Printer-Setup

# Optional: a menu entry so it's reachable from the printer's screen
# without typing gcode. Add under your existing [menu ...] tree, e.g.:
#
# [menu __main __setup __wifi]
# type: command
# name: WiFi Setup Mode
# gcode: WIFI_SETUP_MODE
